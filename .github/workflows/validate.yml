name: Validate lighting foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m generators.validate_model docs/reference-implementations/synthetic-room/lighting-model.json
      - run: python -m generators.model_hierarchy docs/reference-implementations/synthetic-hierarchy/lighting-model.json
      - run: python -m generators.model_hierarchy docs/reference-implementations/synthetic-hierarchy/emergency-model.json
      - run: python -m generators.model_spaces docs/reference-implementations/synthetic-spaces/lighting-model.json
      - run: python -m generators.model_spaces docs/reference-implementations/synthetic-spaces/emergency-model.json
      - run: python -m generators.export_review docs/reference-implementations/synthetic-room/lighting-model.json --output-dir outputs/ci-review
      - run: python -m generators.model_intake docs/reference-implementations/synthetic-intake/lighting-model.json --phase intake
      - run: python -m generators.model_intake docs/reference-implementations/synthetic-intake/design-model.json --phase design
      - run: python -m generators.model_intake docs/reference-implementations/synthetic-intake/emergency-model.json --phase design
      - run: python -m generators.export_intake docs/reference-implementations/synthetic-intake/lighting-model.json --output-dir outputs/ci-intake-review
